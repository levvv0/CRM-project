spring.application.name=CRM

spring.datasource.url=${CRM_DB_URL}
spring.datasource.username=${CRM_DB_USERNAME}
spring.datasource.password=${CRM_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=CRM-Spring-HikariPool

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true