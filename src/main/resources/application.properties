spring.application.name=CRM

spring.datasource.url=${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm_db}
spring.datasource.username=${CRM_DB_USER:postgres}
spring.datasource.password=${CRM_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=CRM-Spring-HikariPool

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true