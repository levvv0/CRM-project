spring.datasource.url=${CRM_TEST_DB_URL:jdbc:postgresql://localhost:5432/crm_test_db}
spring.datasource.username=${CRM_DB_USER:postgres}
spring.datasource.password=${CRM_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.pool-name=CRM-Test-HikariPool

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true